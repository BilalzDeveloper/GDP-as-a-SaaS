name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Typecheck, build, tenant isolation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gdp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gdp_test
      # Build-time placeholders: the build must not need real project secrets.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Recreate Supabase preconditions (auth schema, roles)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f tests/rls/shim.sql

      - name: Apply migrations
        run: npm run db:migrate

      - name: Seed reference data
        run: npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      # Non-negotiable 3: cross-tenant leakage fails the build. Never skip.
      - name: Tenant isolation suite
        run: npm test

      - name: Build
        run: npm run build

      # The brief's stack section asks for Playwright on the critical user
      # flows. These run against the build above, the same Postgres, and a
      # local stand-in for Supabase Auth (tests/e2e/auth-stub.mjs) — the
      # identity provider is the only piece that is not the real thing.
      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end flows
        run: npm run test:e2e

      - name: Keep the report when a flow fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
